<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - VStream</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">VStream</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="category.html?type=movie">Movies</a>
                <a href="category.html?type=tv">TV Shows</a>
                <a href="mylist.html">My List</a>
            </nav>
            <div class="nav-actions">
                <form id="search-form" class="search-box">
                    <input type="text" id="search-input" placeholder="Search...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
                <div class="hamburger"><i class="fas fa-bars"></i></div>
            </div>
        </div>
        <div class="mobile-menu">
            <a href="index.html">Home</a>
            <a href="category.html?type=movie">Movies</a>
            <a href="category.html?type=tv">TV Shows</a>
            <a href="mylist.html">My List</a>
        </div>
    </header>

    <main class="main-content page-padding top-padding">
        <div class="search-header">
            <h1>Search Results for "<span id="search-query-display"></span>"</h1>
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="multi">All</button>
                <button class="filter-btn" data-filter="movie">Movies</button>
                <button class="filter-btn" data-filter="tv">TV Shows</button>
            </div>
        </div>

        <div id="no-results" class="empty-state" style="display:none;">
            <h2>No results found</h2>
            <p>Try different keywords or check spelling.</p>
        </div>

        <div class="grid-layout" id="search-results">
            <!-- Items injected by JS -->
        </div>

        <div class="load-more-container">
            <button id="load-more-btn" class="btn btn-secondary" style="display:none;">Load More</button>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p class="copyright">&copy; 2026 VStream. All Rights Reserved.</p>
        </div>
    </footer>

    <button id="scroll-top"><i class="fas fa-arrow-up"></i></button>
    <div id="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
