<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VStream - Watch TV Shows Online, Watch Movies Online</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">VStream</a>
            
            <nav class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="category.html?type=movie">Movies</a>
                <a href="category.html?type=tv">TV Shows</a>
                <a href="mylist.html">My List</a>
            </nav>

            <div class="nav-actions">
                <form id="search-form" class="search-box">
                    <input type="text" id="search-input" placeholder="Search movies, TV shows...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div class="mobile-menu">
            <a href="index.html" class="active">Home</a>
            <a href="category.html?type=movie">Movies</a>
            <a href="category.html?type=tv">TV Shows</a>
            <a href="mylist.html">My List</a>
            <form id="mobile-search-form" class="mobile-search">
                <input type="text" id="mobile-search-input" placeholder="Search...">
                <button type="submit"><i class="fas fa-search"></i></button>
            </form>
        </div>
    </header>

    <!-- Hero Banner -->
    <section id="hero-banner" class="hero">
        <div class="hero-skeleton"></div>
        <div class="hero-content">
            <h1 id="hero-title" class="skeleton-text skeleton-title"></h1>
            <p id="hero-description" class="skeleton-text skeleton-desc"></p>
            <div class="hero-buttons skeleton-btn-group">
                <button id="hero-play" class="btn btn-primary"><i class="fas fa-play"></i> Play</button>
                <button id="hero-info" class="btn btn-secondary"><i class="fas fa-info-circle"></i> More Info</button>
            </div>
        </div>
        <div class="hero-fade-bottom"></div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Trending Section -->
        <section class="content-row">
            <h2>Trending Now</h2>
            <div class="carousel-container">
                <button class="slider-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
                <div class="carousel" id="trending-row">
                    <!-- Skeletons -->
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                </div>
                <button class="slider-btn next-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>

        <!-- Popular Movies -->
        <section class="content-row">
            <h2>Popular Movies</h2>
            <div class="carousel-container">
                <button class="slider-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
                <div class="carousel" id="popular-movies-row">
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                </div>
                <button class="slider-btn next-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>

        <!-- Top Rated -->
        <section class="content-row">
            <h2>Top Rated</h2>
            <div class="carousel-container">
                <button class="slider-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
                <div class="carousel" id="top-rated-row">
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                </div>
                <button class="slider-btn next-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>

        <!-- Popular TV Shows -->
        <section class="content-row">
            <h2>Popular TV Shows</h2>
            <div class="carousel-container">
                <button class="slider-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
                <div class="carousel" id="popular-tv-row">
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                </div>
                <button class="slider-btn next-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>
        
        <!-- Upcoming Movies -->
        <section class="content-row">
            <h2>Upcoming Movies</h2>
            <div class="carousel-container">
                <button class="slider-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
                <div class="carousel" id="upcoming-row">
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                    <div class="card-skeleton"></div>
                </div>
                <button class="slider-btn next-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-social">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
            <div class="footer-links">
                <a href="#">FAQ</a>
                <a href="#">Help Center</a>
                <a href="#">Terms of Use</a>
                <a href="#">Privacy</a>
                <a href="#">Cookie Preferences</a>
                <a href="#">Corporate Information</a>
            </div>
            <p class="copyright">&copy; 2026 VStream. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Scroll to Top -->
    <button id="scroll-top"><i class="fas fa-arrow-up"></i></button>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Video Modal -->
    <div id="video-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="video-container" id="video-player-container">
                <!-- Iframe inserted here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
